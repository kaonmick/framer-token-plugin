<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Framer Token Importer の Docsify ドキュメントビューア" />
    <title>Framer Token Importer Docs</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #205846;
        --base-font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", sans-serif;
        --heading-font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic", sans-serif;
        --mono-font-family: "SFMono-Regular", Consolas, monospace;
        --sidebar-background: #f4f7f1;
        --sidebar-nav-link-color--active: #205846;
      }

      body {
        letter-spacing: 0;
      }

      .app-name-link img {
        width: 28px;
        height: 28px;
      }
    </style>
  </head>
  <body class="loading">
    <div id="app">読み込み中...</div>
    <script>
      window.$docsify = {
        name: "Framer Token Importer",
        repo: "https://github.com/kaonmick/framer-token-plugin",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        search: {
          paths: "auto",
          placeholder: "検索",
          noData: "一致する文書がありません",
          depth: 3,
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
