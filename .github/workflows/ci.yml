name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Check and Storybook build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build Storybook
        run: npm run build-storybook
